alerts:
  - name: High Latency P95
    severity: warning
    condition: "latency_p95_ms > 3000 for 5m"
    type: symptom-based
    owner: Vũ Huy Hoàng
    runbook: docs/alerts.md#alert-1

  - name: High Error Rate
    severity: critical
    condition: "error_rate_pct > 2 for 5m"
    type: symptom-based
    owner: Vũ Huy Hoàng
    runbook: docs/alerts.md#alert-2

  - name: Cost or Quality SLO Breach
    severity: warning
    condition: "daily_cost_usd > 2.5 OR quality_score_avg < 0.75"
    type: symptom-based
    owner: Vũ Huy Hoàng
    runbook: docs/alerts.md#alert-3